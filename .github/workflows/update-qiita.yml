name: Update Qiita Articles

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-qiita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Qiita Articles
        id: qiita
        run: |
          # Qiita API から最新5件の記事を取得
          curl -s "https://qiita.com/api/v2/users/riel-hosiduki/items?per_page=5" \
            -H "Content-Type: application/json" \
            > /tmp/qiita.json

          # Markdownリスト生成
          python3 << 'EOF'
          import json, os

          with open('/tmp/qiita.json') as f:
              items = json.load(f)

          lines = []
          for item in items:
              title = item['title']
              url   = item['url']
              date  = item['created_at'][:10]
              likes = item['likes_count']
              lines.append(f"- [{title}]({url}) `{date}` ❤️ {likes}")

          md = "\n".join(lines)
          with open('/tmp/qiita_section.md', 'w') as f:
              f.write(md)
          print("Generated:")
          print(md)
          EOF

      - name: Update README
        run: |
          SECTION=$(cat /tmp/qiita_section.md)

          # README の QIITA:START〜QIITA:END を置換
          python3 << 'PYEOF'
          import re

          with open('README.md', 'r') as f:
              content = f.read()

          with open('/tmp/qiita_section.md', 'r') as f:
              section = f.read()

          new_block = f"<!-- QIITA:START -->\n{section}\n<!-- QIITA:END -->"
          content = re.sub(
              r'<!-- QIITA:START -->.*?<!-- QIITA:END -->',
              new_block,
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(content)

          print("README updated.")
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update Qiita articles [skip ci]"
          git push
